        method: local_supcon
        hidden_dims:
        - 512
        - 256
        activation: leaky_relu
        normalization: batch_norm
        epochs: 60
        batch_size: 256
        order_mode: class_chunks
        chunk_size: 16
        optimizer: plain_sgd
        learning_rate: 0.3
        weight_decay: 0.0
        contrastive_temperature: 0.1
      probe:
        learning_rate: 0.3
    - id: batch-sfa
