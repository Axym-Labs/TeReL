evaluation_split: validation
data_root: /home/davwis/main/data/cifar-100/cifar-100-python
seeds: [401]
probe: {epochs: 60, batch_size: 2048, optimizer: adamw, learning_rate: 0.003, weight_decay: 0.0001, readout: all}
runs:
  - id: layer-local-supcon
    encoder: {method: local_supcon, hidden_dims: [4096, 2048], locally_connected: [[16,5,2,2],[32,5,2,2]], activation: leaky_relu, normalization: batch_norm, epochs: 60, batch_size: 256, order_mode: class_chunks, chunk_size: 16, optimizer: adamw, learning_rate: 0.001, weight_decay: 0.0001, contrastive_temperature: 0.1}
  - id: batch-sfa
    encoder: {method: sfa, hidden_dims: [256], order_mode: class_chunks, chunk_size: 16, sfa_components: 256}
  - id: incremental-sfa
    encoder: {method: incsfa, hidden_dims: [32], epochs: 1, order_mode: class_chunks, chunk_size: 16, incsfa_whitening_dim: 32, incsfa_output_dim: 32, incsfa_learning_rate: 0.001}
