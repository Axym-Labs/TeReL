evaluation_split: validation
data_root: /home/davwis/main/data/cifar-100/cifar-100-python
seeds: [401]
probe: {epochs: 60, batch_size: 2048, optimizer: adamw, learning_rate: 0.003, weight_decay: 0.0001, readout: all}
runs:
  - id: terel
    encoder: &terel
      method: terel_residual
      hidden_dims: [512, 256]
      activation: relu
      normalization: none
      training_mode: joint
      epochs: 2
      batch_size: 1
      order_mode: class_chunks
      chunk_size: 16
      optimizer: plain_sgd
      learning_rate: 0.013870266872900201
      weight_decay: 0.000001
      similarity_coefficient: 1.0
      variance_coefficient: 3.001981471213246
      covariance_coefficient: 0.6061334936982908
      variance_target: 1.0
      statistics_momentum: 0.99
      lateral_momentum: 0.995
      residual_lateral_rule: dual_inhibitory
      residual_lateral_coefficient: 0.5749502865863861
      residual_lateral_steps: 1
      residual_lateral_step_size: 0.1
      residual_lateral_include_diagonal: true
      postsynaptic_state_mode: exact
      lateral_matrix_mode: combined
      combined_lateral_state_weight: 0.5911099660677379
      temporal_term_enabled: true
      inference_mode: offline
  - id: random
    encoder: {method: random, hidden_dims: [512, 256], activation: relu, normalization: none}
  - id: supervised-linear
    encoder: {method: supervised_linear, hidden_dims: [512, 256]}
  - id: shuffled-order
    encoder:
      <<: *terel
      order_mode: shuffled
  - id: supervised-offline
    encoder: {method: bp, hidden_dims: [512, 256], activation: relu, normalization: none, epochs: 10, batch_size: 256, optimizer: adamw, learning_rate: 0.0003, weight_decay: 0.0001}
  - id: supervised-offline-30ep
    encoder: {method: bp, hidden_dims: [512, 256], activation: relu, normalization: none, epochs: 30, batch_size: 256, optimizer: adamw, learning_rate: 0.0003, weight_decay: 0.0001}
